{% extends 'base.html' %}

{% block content %}

<div class="faq">
    <h1>Ответы на часто задаваемые вопросы: </h1>
    {% for question in questions %}


    <details>
        <summary>{{question.question_text}}
            <small>
                {{question.answer_date}}
            </small>
        </summary>
        {{question.answer_text }}
    </details>

    {% endfor %}
</div>

{% endblock %}
