{% extends 'base.html' %}

{% block content %}
<div class="news">
    <ul>
        {% for article in news %}
        <li>
            <img src="{{ article.image_url }}" />
            <h2>{{ article.title }}</h2>
            <i>{{ article.text }}</i>
            <a href="/myapp/news/{{ article.id }}">Читать далее</a>
        </li>
        {% endfor %}
    </ul>
</div>

{% endblock %}
