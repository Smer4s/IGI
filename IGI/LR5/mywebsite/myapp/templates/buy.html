{% extends 'base_client.html' %}

{% block content %}
<div class="buy reviews">
    <h3><i>С</i>писок услуг:</h3>

    <form method="post" action="services/">
        {% csrf_token %}

        {% for service in services %}
        <p>
            {% if service.name in selected_services %}
            <input type="checkbox" name="service_name" value="{{service.name}}" checked>

            {% else %}

            <input type="checkbox" name="service_name" value="{{service.name}}">

            {% endif %}

            <strong> {{service.name}}</strong> <em>{{service.price}} </em>
        </p>
        {% endfor %}
        <br />
        Выберите промокод:
        <select name="promo_code">
            {% for code in codes %}
            {% if code.is_active %}
            <option value="{{code.code}}">{{code.code}} {{code.value}}%</option>
            {% endif %}
            {% endfor %}
        </select>
        <br />
        <br />

        <button type="submit">Купить услуги</button>
    </form>

</div>

{% endblock %}
