{% extends 'base.html' %}

{% block content %}
<div class="coupons">
    <h1>Скидки и купоны:</h1>
    <ul>
        {% for discount in discounts %}
            {% if discount.is_active %}
        <li class="coupon-item active">
            {% else %}
        <li class="coupon-item archived">
            {% endif %}

            Код: {{discount.code}}
            Процент скидки: {{discount.value}}%
        </li>

        {% endfor %}
    </ul>
</div>
{% endblock %}
