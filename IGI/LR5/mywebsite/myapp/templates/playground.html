{% load static %}

<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки отображения</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .settings-panel {
            display: none;
            margin-top: 20px;
        }

        .image-container img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>

    <div>
        <label>
            <input type="checkbox" id="toggleSettings">
            Показать настройки отображения
        </label>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <label for="fontSize">Размер шрифта:</label>
        <input type="range" id="fontSize" name="fontSize" min="10" max="100" value="16">
        <br>
        <label for="textColor">Цвет текста:</label>
        <input type="color" id="textColor" name="textColor" value="#000000">
        <br>
        <label for="bgColor">Цвет фона:</label>
        <input type="color" id="bgColor" name="bgColor" value="#ffffff">
    </div>

    <div class="content">
        <p>Это текст, который можно настроить.</p>
        <div class="image-container">
            <img src="https://w7.pngwing.com/pngs/973/255/png-transparent-red-apple-apple-fruit-apple-natural-foods-food-grocery-store-thumbnail.png"
                alt="Пример изображения">
        </div>
    </div>

    <div id="chartContainer">
        <canvas id="myChart"></canvas>
    </div>

    <h1>Учебники для средней школы</h1>
    <form id="textbookForm">
        <label for="subject">Предмет:</label>
        <input type="text" id="subject" name="subject" required value="Физика" minlength="1"><br>
        <label for="author">Автор:</label>
        <input type="text" id="author" name="author" required value="Арефьев" minlength="1"><br>
        <label for="classNumber">Класс:</label>
        <input type="number" id="classNumber" name="classNumber" min="1" max="11" required value="1"><br>
        <button type="button" id="addTextbookButton">Добавить учебник</button>
    </form>
    <h2>Список учебников</h2>
    <div id="textbookList"></div>
    <button type="button" id="resultButton">Получить Результат</button>
    <h2>Результат</h2>
    <div id="result"></div>
    <div>
        <label>
            <input type="checkbox" id="useOOP"> Использовать ООП решение
        </label>
    </div>

    <script src="{% static 'playground.js' %}"></script>

</body>

</html>
