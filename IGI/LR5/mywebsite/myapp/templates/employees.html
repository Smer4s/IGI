{% extends 'base.html' %}

{% block content %}
<div class="vacancies">
    <h1>Открытые Вакансии:</h1>
    <ul>
        {% for employee in employees %}
        <li class="vacancy-item">
            <h2>{{employee.name}}</h2>
            <p>{{employee.description}}</p>
        </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
